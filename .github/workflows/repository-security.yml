name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install verified scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' -o "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/merchant-security-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/merchant-security-bin" gitleaks
          echo "$RUNNER_TEMP/merchant-security-bin" >> "$GITHUB_PATH"
      - name: Check Git history and index
        run: node scripts/check-repository.mjs
      - name: Test security boundaries
        run: node --test tests/security/*.test.js
